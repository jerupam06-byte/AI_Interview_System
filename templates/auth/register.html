{% extends "base.html" %}

{% block title %}Create Candidate Account | AI Interview Prep{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="badge badge-cyan" style="margin-bottom: 0.5rem;">New Candidate Registration</span>
      <h1>Get Placement Ready</h1>
      <p>Practice role-specific mock interviews and track your progress.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="e.g. Alex Johnson" 
          value="{{ name or '' }}"
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="alex@college.edu" 
          value="{{ email or '' }}"
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="At least 6 characters" 
          required 
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="Re-enter password" 
          required 
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Register & Begin Practice
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
